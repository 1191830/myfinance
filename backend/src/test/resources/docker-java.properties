# Docker 29+ bumped its API version and broke Testcontainers 1.x's environment detection
# (every named-pipe/TCP strategy gets a malformed /info response) - see
# https://github.com/testcontainers/testcontainers-java/issues/11212. The real fix only
# shipped in Testcontainers 2.x; for the 1.x line this project is on, the documented
# workaround is pinning docker-java's own client API version down to one Docker 29 still
# serves correctly. docker-java reads this file straight off the classpath automatically.
api.version=1.44
