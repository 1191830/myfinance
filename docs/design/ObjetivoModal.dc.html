<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', system-ui, sans-serif; color: #1b2733; -webkit-font-smoothing: antialiased; }
    a { color: #1f6fbf; text-decoration: none; }
    a:hover { color: #1a5fa4; }
    select, input { font-family: inherit; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .flabel { font-size: 12px; font-weight: 500; color: #5c6b7a; }
    .finput { height: 36px; width: 100%; border-radius: 6px; border: 1px solid #d7dbe0; background: #fff; padding: 0 12px; font-size: 13px; color: #1b2733; outline: none; }
  </style>
</helmet>

<div style="position: relative; width: 640px; height: 540px; background: #f5f6f8; overflow: hidden;">
  <div style="position: absolute; inset: 0; background: rgba(18,32,47,0.45); display: flex; align-items: center; justify-content: center; padding: 16px;">
    <div style="width: 100%; max-width: 448px; border-radius: 8px; border: 1px solid #e5e8ec; background: #ffffff; padding: 20px; box-shadow: 0 10px 30px rgba(18,32,47,0.25);">
      <form style="display: flex; flex-direction: column; gap: 14px;">
        <div style="font-size: 15px; font-weight: 600; color: #1b2733;">Novo objetivo</div>

        <div class="field">
          <span class="flabel">Nome</span>
          <input class="finput" type="text" value="Emergency Fund">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="field">
            <span class="flabel">Meta (€)</span>
            <input class="finput" type="text" value="5000.00">
          </div>
          <div class="field">
            <span class="flabel">Atual (€)</span>
            <input class="finput" type="text" value="1500.00">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="field">
            <span class="flabel">Início</span>
            <input class="finput" type="text" value="01/06/2024">
          </div>
          <div class="field">
            <span class="flabel">Fim (opcional)</span>
            <input class="finput" type="text" value="">
          </div>
        </div>

        <div style="margin-top: 6px; display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" style="height: 36px; border-radius: 6px; border: 1px solid #d7dbe0; background: #ffffff; padding: 0 16px; font-size: 13px; font-weight: 500; color: #1b2733;">Cancelar</button>
          <button type="button" style="height: 36px; border-radius: 6px; border: none; background: #1f6fbf; padding: 0 16px; font-size: 13px; font-weight: 500; color: #ffffff;">Criar objetivo</button>
        </div>
      </form>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
