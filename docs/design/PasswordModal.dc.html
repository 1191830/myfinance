<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', system-ui, sans-serif; color: #1b2733; -webkit-font-smoothing: antialiased; }
    a { color: #1f6fbf; text-decoration: none; }
    a:hover { color: #1a5fa4; }
    select, input { font-family: inherit; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .flabel { font-size: 12px; font-weight: 500; color: #5c6b7a; }
    .finput { height: 36px; width: 100%; border-radius: 6px; border: 1px solid #d7dbe0; background: #fff; padding: 0 40px 0 12px; font-size: 13px; color: #1b2733; outline: none; }
    .pwrap { position: relative; display: flex; }
    .eyebtn { position: absolute; right: 6px; top: 6px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 4px; color: #8a97a4; cursor: pointer; }
    .eyebtn:hover { background: #f2f4f6; color: #5c6b7a; }
    .cap { font-size: 11px; color: #8a97a4; margin-top: 4px; }
  </style>
</helmet>

<div style="position: relative; width: 480px; height: 560px; background: #f5f6f8; overflow: hidden;">
  <div style="position: absolute; inset: 0; background: {{overlayBg}}; display: flex; align-items: center; justify-content: center; padding: 16px;">
    <div style="width: 100%; max-width: 384px; border-radius: 8px; border: 1px solid #e5e8ec; background: #ffffff; padding: 20px; box-shadow: 0 10px 30px rgba(18,32,47,0.25);">
      <form style="display: flex; flex-direction: column; gap: 14px;">

        <sc-if value="{{forced}}" hint-placeholder-val="{{false}}">
          <div>
            <div style="font-size: 15px; font-weight: 600; color: #1b2733;">Primeiro acesso</div>
            <div style="font-size: 13px; line-height: 1.5; color: #5c6b7a; margin-top: 6px;">Por segurança, tem de definir uma nova palavra-passe antes de continuar.</div>
          </div>
        </sc-if>
        <sc-if value="{{notForced}}" hint-placeholder-val="{{true}}">
          <div style="font-size: 15px; font-weight: 600; color: #1b2733;">Alterar palavra-passe</div>
        </sc-if>

        <div class="field">
          <span class="flabel">Palavra-passe atual</span>
          <div class="pwrap">
            <input class="finput" type="{{current.type}}" value="{{current.value}}" onChange="{{current.onInput}}" placeholder="••••••••">
            <button type="button" class="eyebtn" onClick="{{current.toggle}}" aria-label="Mostrar palavra-passe atual">
              <sc-if value="{{current.hidden}}" hint-placeholder-val="{{true}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </sc-if>
              <sc-if value="{{current.visible}}" hint-placeholder-val="{{false}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M6.3 6.3C4 8 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-3.2 4.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </sc-if>
            </button>
          </div>
        </div>

        <div class="field">
          <span class="flabel">Nova palavra-passe</span>
          <div class="pwrap">
            <input class="finput" type="{{newPw.type}}" value="{{newPw.value}}" onChange="{{newPw.onInput}}" placeholder="••••••••">
            <button type="button" class="eyebtn" onClick="{{newPw.toggle}}" aria-label="Mostrar nova palavra-passe">
              <sc-if value="{{newPw.hidden}}" hint-placeholder-val="{{true}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </sc-if>
              <sc-if value="{{newPw.visible}}" hint-placeholder-val="{{false}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M6.3 6.3C4 8 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-3.2 4.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </sc-if>
            </button>
          </div>
          <div class="cap">Mínimo 8 carateres.</div>
        </div>

        <div class="field">
          <span class="flabel">Confirmar nova palavra-passe</span>
          <div class="pwrap">
            <input class="finput" type="{{confirm.type}}" value="{{confirm.value}}" onChange="{{confirm.onInput}}" placeholder="••••••••">
            <button type="button" class="eyebtn" onClick="{{confirm.toggle}}" aria-label="Mostrar confirmação da palavra-passe">
              <sc-if value="{{confirm.hidden}}" hint-placeholder-val="{{true}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </sc-if>
              <sc-if value="{{confirm.visible}}" hint-placeholder-val="{{false}}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M6.3 6.3C4 8 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-3.2 4.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </sc-if>
            </button>
          </div>
        </div>

        <sc-if value="{{hasError}}" hint-placeholder-val="{{false}}">
          <div style="font-size: 12px; color: #c23b3b;">{{error}}</div>
        </sc-if>

        <sc-if value="{{success}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #1f8a5f; background: #e7f4ee; padding: 8px 10px; border-radius: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            Palavra-passe atualizada.
          </div>
        </sc-if>

        <div style="margin-top: 6px; display: flex; justify-content: flex-end; gap: 10px;">
          <sc-if value="{{showCancel}}" hint-placeholder-val="{{true}}">
            <button type="button" onClick="{{cancel}}" style="height: 36px; border-radius: 6px; border: 1px solid #d7dbe0; background: #ffffff; padding: 0 16px; font-size: 13px; font-weight: 500; color: #1b2733;">Cancelar</button>
          </sc-if>
          <button type="button" onClick="{{submit}}" style="height: 36px; border-radius: 6px; border: none; background: #1f6fbf; padding: 0 16px; font-size: 13px; font-weight: 500; color: #ffffff;">{{submitLabel}}</button>
        </div>
      </form>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"forced":{"editor":"boolean","default":false}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      current: '',
      newPw: '',
      confirm: '',
      showCurrent: false,
      showNew: false,
      showConfirm: false,
      error: '',
      success: false,
    };
  }

  renderVals() {
    const forced = this.props.forced ?? false;
    const s = this.state;

    const field = (key, showKey) => ({
      value: s[key],
      type: s[showKey] ? 'text' : 'password',
      visible: s[showKey],
      hidden: !s[showKey],
      onInput: (e) => this.setState({ [key]: e.target.value, error: '', success: false }),
      toggle: () => this.setState({ [showKey]: !this.state[showKey] }),
    });

    const submit = () => {
      if (!this.state.current) {
        this.setState({ error: 'Introduza a palavra-passe atual.', success: false });
        return;
      }
      if (this.state.newPw.length < 8) {
        this.setState({ error: 'A nova palavra-passe deve ter pelo menos 8 carateres.', success: false });
        return;
      }
      if (this.state.newPw !== this.state.confirm) {
        this.setState({ error: 'As palavras-passe não coincidem.', success: false });
        return;
      }
      this.setState({ error: '', success: true });
    };

    const cancel = () => this.setState({
      current: '', newPw: '', confirm: '',
      showCurrent: false, showNew: false, showConfirm: false,
      error: '', success: false,
    });

    return {
      forced,
      notForced: !forced,
      showCancel: !forced,
      submitLabel: forced ? 'Continuar' : 'Guardar',
      overlayBg: forced ? 'transparent' : 'rgba(18,32,47,0.45)',
      current: field('current', 'showCurrent'),
      newPw: field('newPw', 'showNew'),
      confirm: field('confirm', 'showConfirm'),
      hasError: !!s.error,
      error: s.error,
      success: s.success,
      submit,
      cancel,
    };
  }
}
</script>
</body>
</html>
